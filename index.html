<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Prompt Helper - Best AI Prompts</title>
  <meta name="description" content="Find and copy the best AI photo, fashion, background, couple and video prompts.">
  <link rel="stylesheet" href="style.css">
</head>

<body>

<header>
  <h1>✨ AI Prompt Helper</h1>
  <p>Best AI Prompts — Copy & Create</p>
</header>

<main>

  <div class="search-box">
    <input type="text" id="searchInput" placeholder="🔎 Search prompts...">
  </div>

  <div class="categories">
    <button onclick="filterPrompts('All')">All</button>
    <button onclick="filterPrompts('Photo')">📸 Photo</button>
    <button onclick="filterPrompts('Fashion')">👗 Fashion</button>
    <button onclick="filterPrompts('Background')">🌄 Background</button>
    <button onclick="filterPrompts('Couple')">❤️ Couple</button>
    <button onclick="filterPrompts('Video')">🎬 Video</button>
    <button onclick="filterPrompts('Attitude')">😎 Attitude</button>
  </div>

  <section id="promptContainer"></section>

</main>

<footer>
  <p>© 2026 AI Prompt Helper | All Rights Reserved</p>
</footer>

<script src="app.js"></script>

</body>
</html>
